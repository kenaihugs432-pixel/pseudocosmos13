<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AR com WebXR — GLB r180</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
      background: #000;
      color: #fff;
    }

    #message {
      position: fixed;
      left: 10px;
      top: 10px;
      z-index: 20;
      background: #fff;
      color: #000;
      padding: 8px 10px;
      border-radius: 6px;
      box-shadow: 0 2px 10px rgba(0,0,0,.2);
      max-width: calc(100% - 24px);
      line-height: 1.35;
    }

    #errorBox {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      z-index: 21;
      display: none;
      max-height: 42vh;
      overflow: auto;
      box-sizing: border-box;
      background: rgba(0,0,0,.88);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }

    #debug {
      position: fixed;
      right: 10px;
      top: 10px;
      z-index: 20;
      display: none;
      max-width: 70vw;
      max-height: 35vh;
      overflow: auto;
      box-sizing: border-box;
      background: rgba(0,0,0,.75);
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 11px;
      white-space: pre-wrap;
    }

    model-viewer.fallback-preview {
      position: fixed;
      right: 10px;
      bottom: 10px;
      width: 120px;
      height: 120px;
      z-index: 19;
      border-radius: 8px;
      overflow: hidden;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/": "https://cdn.jsdelivr.net/npm/three@0.180.0/"
    }
  }
  </script>

  <script type="module">
    /*
     * model-viewer é usado apenas como fallback no iOS.
     * Para o teste do GLTFLoader, todas as dependências Three.js estão
     * fixadas em 0.180.0 para evitar misturar versões.
     */
    import "https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js";
  </script>
</head>

<body>
  <div id="message">Iniciando…</div>
  <div id="errorBox"></div>
  <div id="debug"></div>

  <script type="module">
    import * as THREE from "three";

    import { GLTFLoader } from
      "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";

    import { ARButton } from
      "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/ARButton.js";

    import * as SkeletonUtilsModule from
      "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/utils/SkeletonUtils.js";

    const MODEL_URL = "./aha2.glb";
    const USDZ_URL = "./aha2.usdz";
    const TARGET_MODEL_HEIGHT = 0.20;

    const $ = (id) => document.getElementById(id);

    function setMessage(text) {
      $("message").textContent = text;
    }

    function showError(text, error = null) {
      const details = error
        ? `${text}\n${error?.stack || error?.message || String(error)}`
        : text;

      $("errorBox").style.display = "block";
      $("errorBox").textContent += details + "\n\n";
      console.error(details, error || "");
    }

    function showDebug(text) {
      $("debug").style.display = "block";
      $("debug").textContent += text + "\n";
      console.log(text);
    }

    function isIOS() {
      return /iP(hone|od|ad)/.test(navigator.platform)
        || (navigator.userAgent.includes("Mac") && "ontouchend" in document);
    }

    async function validateGLB(url) {
      const response = await fetch(url, {
        method: "GET",
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(`aha2.glb retornou HTTP ${response.status}`);
      }

      const contentType = response.headers.get("content-type") || "(não informado)";
      const buffer = await response.arrayBuffer();

      if (buffer.byteLength < 12) {
        throw new Error(
          `Arquivo pequeno demais para ser GLB: ${buffer.byteLength} bytes.`
        );
      }

      const view = new DataView(buffer);

      const magic = String.fromCharCode(
        view.getUint8(0),
        view.getUint8(1),
        view.getUint8(2),
        view.getUint8(3)
      );

      const version = view.getUint32(4, true);
      const declaredLength = view.getUint32(8, true);

      showDebug(
        [
          "=== VALIDAÇÃO GLB ===",
          `HTTP: ${response.status}`,
          `Content-Type: ${contentType}`,
          `Tamanho recebido: ${buffer.byteLength} bytes`,
          `Magic: ${magic}`,
          `Versão GLB: ${version}`,
          `Tamanho declarado: ${declaredLength} bytes`
        ].join("\n")
      );

      if (magic !== "glTF") {
        throw new Error(
          `O servidor não entregou um GLB válido. Magic encontrado: "${magic}".`
        );
      }

      if (version !== 2) {
        throw new Error(
          `Versão GLB inesperada: ${version}. Este código espera GLB 2.`
        );
      }

      if (declaredLength !== buffer.byteLength) {
        throw new Error(
          `Tamanho inconsistente: header=${declaredLength}, recebido=${buffer.byteLength}.`
        );
      }

      return buffer;
    }

    /*
     * Fazemos a validação antes do GLTFLoader.
     * Isso diferencia erro de rede/arquivo de erro do parser.
     */
    let glbBytes;

    try {
      setMessage("Verificando aha2.glb…");

      glbBytes = await validateGLB(MODEL_URL);

      showDebug("✅ Header do GLB válido.");
    } catch (error) {
      showError("❌ Falha na validação de aha2.glb.", error);
      setMessage("Erro no GLB. Veja o painel de erro.");
      throw error;
    }

    // ------------------------------------------------------------------
    // THREE / WEBXR
    // ------------------------------------------------------------------

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;

    if ("outputColorSpace" in renderer && THREE.SRGBColorSpace) {
      renderer.outputColorSpace = THREE.SRGBColorSpace;
    }

    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;

    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.01,
      50
    );

    // Iluminação
    scene.add(new THREE.AmbientLight(0xffffff, 1.15));
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.7));

    const dir = new THREE.DirectionalLight(0xffffff, 0.9);
    dir.position.set(1, 2, 1);
    scene.add(dir);

    // Retículo para o hit-test
    const reticle = new THREE.Mesh(
      new THREE.RingGeometry(0.06, 0.08, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({
        color: 0x00ff88
      })
    );

    reticle.visible = false;
    reticle.matrixAutoUpdate = false;
    scene.add(reticle);

    // Ambiente opcional
    try {
      const pmrem = new THREE.PMREMGenerator(renderer);
      pmrem.compileEquirectangularShader();

      const tl = new THREE.TextureLoader();
      const envUrl =
        "https://threejs.org/examples/textures/2294472375_24a3b8ef46_o.jpg";

      const envTex = await new Promise((resolve, reject) => {
        tl.load(envUrl, resolve, undefined, reject);
      });

      envTex.mapping = THREE.EquirectangularReflectionMapping;

      if ("colorSpace" in envTex && THREE.SRGBColorSpace) {
        envTex.colorSpace = THREE.SRGBColorSpace;
      }

      scene.environment = pmrem.fromEquirectangular(envTex).texture;

      envTex.dispose();
      pmrem.dispose();

      showDebug("✅ Ambiente HDR carregado.");
    } catch (error) {
      console.warn("Ambiente falhou; continuando sem ele.", error);
      showDebug("⚠️ Ambiente HDR falhou; não é crítico.");
    }

    // ------------------------------------------------------------------
    // GLTF LOADER
    // ------------------------------------------------------------------

    const loader = new GLTFLoader();

    let baseGLTF = null;
    let modelPrototype = null;
    let modelReady = false;
    let placedModel = null;
    let placedAnchor = null;

    showDebug("Iniciando GLTFLoader r180.0…");

    loader.load(
      MODEL_URL,

      (gltf) => {
        baseGLTF = gltf;
        modelPrototype = gltf.scene;

        const bounds = new THREE.Box3().setFromObject(modelPrototype);
        const size = new THREE.Vector3();
        bounds.getSize(size);

        const modelHeight = size.y;

        showDebug(
          `Modelo carregado: ${size.x.toFixed(4)} x ${size.y.toFixed(4)} x ${size.z.toFixed(4)}`
        );

        if (modelHeight > 0 && Number.isFinite(modelHeight)) {
          const realScale = TARGET_MODEL_HEIGHT / modelHeight;
          modelPrototype.scale.setScalar(realScale);

          showDebug(
            `Escala aplicada: ${realScale} | altura final: ${TARGET_MODEL_HEIGHT} m`
          );
        } else {
          showError(
            "O GLB carregou, mas a altura calculada do modelo é inválida."
          );
          return;
        }

        modelPrototype.traverse((node) => {
          if (node.isMesh && node.material) {
            if (Array.isArray(node.material)) {
              for (const material of node.material) {
                material.side = THREE.DoubleSide;
                material.needsUpdate = true;
              }
            } else {
              node.material.side = THREE.DoubleSide;
              node.material.needsUpdate = true;
            }
          }
        });

        modelReady = true;
        setMessage(
          "✅ Modelo carregado. Toque em uma superfície para posicionar."
        );

        showDebug(
          `✅ GLTFLoader carregou o modelo. Animações: ${
            gltf.animations?.length || 0
          }`
        );
      },

      (progress) => {
        if (progress && progress.total) {
          const percent = Math.round(
            (progress.loaded / progress.total) * 100
          );
          setMessage(`Carregando modelo… ${percent}%`);
        }
      },

      (error) => {
        showError(
          "❌ GLTFLoader falhou ao interpretar aha2.glb.",
          error
        );
        setMessage("Erro no GLTFLoader. Veja o painel de erro.");
      }
    );

    // ------------------------------------------------------------------
    // iOS / model-viewer fallback
    // ------------------------------------------------------------------

    if (isIOS()) {
      const arLink = document.createElement("a");

      arLink.href = new URL(USDZ_URL, location.href).href;
      arLink.setAttribute("rel", "ar");

      arLink.style.position = "fixed";
      arLink.style.left = "10px";
      arLink.style.bottom = "10px";
      arLink.style.zIndex = "40";
      arLink.style.padding = "10px 14px";
      arLink.style.background = "#0b84ff";
      arLink.style.color = "#fff";
      arLink.style.borderRadius = "8px";
      arLink.style.textDecoration = "none";

      arLink.textContent = "Abrir AR (iOS Quick Look)";
      document.body.appendChild(arLink);

      const mv = document.createElement("model-viewer");

      mv.setAttribute("src", MODEL_URL);
      mv.setAttribute("ios-src", new URL(USDZ_URL, location.href).href);
      mv.setAttribute("ar", "");
      mv.setAttribute(
        "ar-modes",
        "webxr quick-look scene-viewer"
      );
      mv.setAttribute("camera-controls", "");
      mv.classList.add("fallback-preview");

      document.body.appendChild(mv);

      setMessage(
        "iOS detectado — toque em \"Abrir AR (iOS Quick Look)\"."
      );
    } else {
      // --------------------------------------------------------------
      // WebXR AR
      // --------------------------------------------------------------

      try {
        document.body.appendChild(
          ARButton.createButton(renderer, {
            requiredFeatures: ["hit-test"],
            optionalFeatures: ["local-floor", "dom-overlay"],
            domOverlay: {
              root: document.body
            }
          })
        );
      } catch (error) {
        showError("❌ Não foi possível criar o botão AR.", error);
        setMessage("WebXR AR não disponível neste dispositivo.");
      }
    }

    // ------------------------------------------------------------------
    // HIT TEST + ANCHOR
    // ------------------------------------------------------------------

    const mixers = [];
    const clock = new THREE.Clock();

    const controller = renderer.xr.getController(0);
    scene.add(controller);

    let latestHitResult = null;
    const tmpMatrix = new THREE.Matrix4();

    controller.addEventListener("select", async () => {
      if (!modelReady) {
        setMessage("Modelo ainda carregando.");
        return;
      }

      if (!latestHitResult || placedModel || placedAnchor) {
        return;
      }

      const placedRoot = new THREE.Group();

      const skeletonUtils =
        SkeletonUtilsModule.SkeletonUtils ||
        SkeletonUtilsModule.default ||
        SkeletonUtilsModule;

      const clone =
        skeletonUtils &&
        typeof skeletonUtils.clone === "function"
          ? skeletonUtils.clone(modelPrototype)
          : modelPrototype.clone(true);

      placedRoot.add(clone);
      scene.add(placedRoot);

      placedModel = placedRoot;

      const session = renderer.xr.getSession();

      try {
        if (
          session &&
          typeof latestHitResult.createAnchor === "function"
        ) {
          placedAnchor = await latestHitResult.createAnchor();

          const ref = renderer.xr.getReferenceSpace();
          const pose = latestHitResult.getPose(ref);

          if (pose) {
            tmpMatrix.fromArray(pose.transform.matrix);

            placedRoot.matrix.copy(tmpMatrix);
            placedRoot.matrixAutoUpdate = false;
          }

          setMessage("✅ Modelo ancorado no mundo real.");
        } else {
          const ref = renderer.xr.getReferenceSpace();
          const pose = latestHitResult.getPose(ref);

          if (pose) {
            tmpMatrix.fromArray(pose.transform.matrix);

            placedRoot.matrix.copy(tmpMatrix);
            placedRoot.matrixAutoUpdate = false;
          }

          setMessage("✅ Modelo posicionado.");
        }
      } catch (error) {
        console.warn(
          "Anchor falhou; usando posicionamento fixo.",
          error
        );

        const ref = renderer.xr.getReferenceSpace();
        const pose = latestHitResult.getPose(ref);

        if (pose) {
          tmpMatrix.fromArray(pose.transform.matrix);

          placedRoot.matrix.copy(tmpMatrix);
          placedRoot.matrixAutoUpdate = false;
        }

        setMessage("✅ Modelo posicionado sem anchor.");
      }

      if (
        baseGLTF &&
        baseGLTF.animations &&
        baseGLTF.animations.length
      ) {
        const mixer = new THREE.AnimationMixer(clone);

        for (const clip of baseGLTF.animations) {
          mixer.clipAction(clip).play();
        }

        mixers.push(mixer);
      }
    });

    // ------------------------------------------------------------------
    // RENDER LOOP
    // ------------------------------------------------------------------

    renderer.setAnimationLoop((_, frame) => {
      const delta = clock.getDelta();

      for (const mixer of mixers) {
        mixer.update(delta);
      }

      if (frame) {
        const session = renderer.xr.getSession();
        const referenceSpace = renderer.xr.getReferenceSpace();

        if (
          session &&
          !session.__hitTestSourceRequested
        ) {
          session.__hitTestSourceRequested = true;

          session
            .requestReferenceSpace("viewer")
            .then((viewerSpace) => {
              return session.requestHitTestSource({
                space: viewerSpace
              });
            })
            .then((source) => {
              session.__hitTestSource = source;
            })
            .catch((error) => {
              console.warn(
                "requestHitTestSource falhou:",
                error
              );
            });
        }

        const hitTestSource =
          session && session.__hitTestSource;

        if (hitTestSource && referenceSpace) {
          const results =
            frame.getHitTestResults(hitTestSource);

          if (results.length > 0) {
            latestHitResult = results[0];

            const pose =
              latestHitResult.getPose(referenceSpace);

            if (pose) {
              tmpMatrix.fromArray(
                pose.transform.matrix
              );

              reticle.matrix.copy(tmpMatrix);
              reticle.visible = true;
            } else {
              reticle.visible = false;
            }
          } else {
            latestHitResult = null;
            reticle.visible = false;
          }
        }

        if (
          placedAnchor &&
          placedModel &&
          referenceSpace &&
          typeof frame.getPose === "function"
        ) {
          try {
            const anchorPose = frame.getPose(
              placedAnchor.anchorSpace,
              referenceSpace
            );

            if (anchorPose) {
              tmpMatrix.fromArray(
                anchorPose.transform.matrix
              );

              placedModel.matrix.copy(tmpMatrix);
              placedModel.matrixAutoUpdate = false;
            }
          } catch (error) {
            console.warn(
              "Falha ao atualizar anchor:",
              error
            );
          }
        }
      }

      renderer.render(scene, camera);
    });

    // ------------------------------------------------------------------
    // RESIZE
    // ------------------------------------------------------------------

    window.addEventListener("resize", () => {
      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    });

    // ------------------------------------------------------------------
    // Diagnóstico final
    // ------------------------------------------------------------------

    showDebug(`Three.js: ${THREE.REVISION}`);
    showDebug(
      `WebXR disponível no navegador: ${
        "xr" in navigator ? "sim" : "não"
      }`
    );
  </script>
</body>
</html>
